<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Event Registration System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#eaf2ff;
}

.container{
    width:420px;
    background:#0B3B75;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
    color:white;
    margin-bottom:10px;
}

p{
    color:#d8e6ff;
    margin-bottom:30px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    margin:12px 0;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

.student{
    background:#ff9800;
    color:white;
}

.student:hover{
    background:#e68900;
}

.admin{
    background:#e68900;
    color: white;
}

.admin:hover{
    background:#e68900;
}
</style>

</head>
<body>

<div class="container">

<h1>College Event Registration System</h1>

<button class="student" onclick="location.href='index.html'">
🎓 Student
</button>

<button class="admin" onclick="location.href='admin.html'">
👨‍💼 Admin
</button>

</div>

</body>
</html>
